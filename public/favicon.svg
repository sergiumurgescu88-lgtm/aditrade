<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66FCF1" />
      <stop offset="50%" stop-color="#45A29E" />
      <stop offset="100%" stop-color="#1F2833" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#0B0C10" />
  <rect width="96" height="96" x="2" y="2" rx="20" fill="none" stroke="#66FCF1" stroke-width="1.5" stroke-opacity="0.3" />
  
  <!-- Trinity Triangle Geometric Emblem -->
  <g transform="translate(50, 52)" filter="url(#glow)">
    <!-- Outer Shield / Triangle -->
    <polygon points="0,-32 28,18 -28,18" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-linejoin="round" />
    <!-- Inner Core -->
    <polygon points="0,-16 14,9 -14,9" fill="#66FCF1" fill-opacity="0.85" />
    <!-- Center Dot Pulse -->
    <circle cx="0" cy="2" r="3" fill="#FFFFFF" />
  </g>
</svg>
